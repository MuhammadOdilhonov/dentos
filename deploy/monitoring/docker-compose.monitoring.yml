name: dentos-monitoring
# Monitoring steki. ASOSIY stek bilan bir docker tarmog'ida ishlashi uchun uni asosiy
# compose'dan keyin ishga tushiring (RUNBOOK). Panellar FAQAT 127.0.0.1'ga bog'lanadi —
# tashqariga ochilmaydi; kirish SSH tunnel orqali (himoyalangan).
services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    pid: host
    volumes: ["/:/host:ro,rslave"]
    command: ["--path.rootfs=/host"]
    expose: ["9100"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose: ["8080"]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    expose: ["9187"]

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    # Navbat uzunligi uchun list kalitlarini ham eksport qiladi (default/media/ops).
    command: ["--redis.addr=redis://redis:6379", "--check-keys=default,media,ops"]
    expose: ["9121"]

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    restart: unless-stopped
    expose: ["9115"]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3001
    volumes: [grafanadata:/var/lib/grafana]
    ports: ["127.0.0.1:3001:3000"]   # faqat lokal — SSH tunnel bilan kiriladi

volumes:
  promdata:
  grafanadata:

# Asosiy stek tarmog'iga ulanish RUNBOOK'da (external network yoki bitta compose project).
