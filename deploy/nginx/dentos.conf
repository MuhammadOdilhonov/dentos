# Dentos — Nginx + HTTPS (Caddy muqobili). Rasmga mos same-origin /api yo'nalishi.
#   https://dentos.cc/api/*  → api(Django)     ;  qolgani → frontend(Next standalone)
#   https://backend.dentos.cc/* → api(Django)
# Sertifikatlar: certbot webroot (/var/www/certbot) + /etc/letsencrypt (docker-compose.nginx.yml).
# Yuklash limiti (client_max_body_size) va timeout backend bilan MOS (gunicorn --timeout 330,
# MAX_PATIENT_FILE_BYTES=512MB). Limitni oshirish bilan backend/xotira muammosini yashirmaymiz.

upstream dentos_api      { server api:8000; }
upstream dentos_frontend { server frontend:3000; }

# ── HTTP (80): ACME challenge + HTTPS redirect ──
server {
    listen 80;
    listen [::]:80;
    server_name dentos.cc backend.dentos.cc;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── Umumiy proxy sozlamalari ──
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ── backend.dentos.cc → Django ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name backend.dentos.cc;

    ssl_certificate     /etc/letsencrypt/live/backend.dentos.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.dentos.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    server_tokens off;

    client_max_body_size 520M;

    location / {
        proxy_pass http://dentos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;          # Django SECURE_PROXY_SSL_HEADER
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 330s;                            # gunicorn --timeout 330 bilan mos
        proxy_send_timeout 330s;
        proxy_request_buffering off;                        # katta skan upload'ni stream qiladi
    }
}

# ── dentos.cc → Next (frontend) + same-origin /api,/admin,/static → Django ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dentos.cc;

    ssl_certificate     /etc/letsencrypt/live/dentos.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dentos.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    server_tokens off;

    client_max_body_size 520M;

    location ~ ^/(api|admin|static|media)/ {
        proxy_pass http://dentos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://dentos_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
